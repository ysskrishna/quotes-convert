[project]
name = "quotes-convert"
version = "1.2.0"
description = "Convert matching double-quotes to single-quotes or vice versa in strings and streams. Inspired by the popular to-single-quotes npm package"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Y. Siva Sai Krishna", email = "sivasaikrishnassk@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing",
  "Topic :: Utilities",
  "Typing :: Typed",
]
keywords = [
    "quotes",
    "convert",
    "single-quotes",
    "double-quotes",
    "escaping",
    "strings",
    "text-processing",
    "utilities",
    "string-manipulation",
    "zero-dependency",
    "type-safe",
    "streaming",
    "developer-tools",
    "json-formatting",
    "quote-conversion",
    "string-formatting",
    "python-strings",
    "cli",
    "command-line",
]
dependencies = []

[project.optional-dependencies]
cli = ["typer>=0.9.0"]

[project.scripts]
quotes-convert = "quotes_convert.cli:cli_main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings>=0.26.1",
    "mkdocstrings-python>=1.11.1",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/ysskrishna/quotes-convert"
Documentation = "https://ysskrishna.github.io/quotes-convert/"
Repository = "https://github.com/ysskrishna/quotes-convert.git"
Issues = "https://github.com/ysskrishna/quotes-convert/issues"
Changelog = "https://github.com/ysskrishna/quotes-convert/blob/main/CHANGELOG.md"
Download = "https://pypi.org/project/quotes-convert/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quotes_convert"]
